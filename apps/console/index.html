<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- With dark icons on, iOS darkens what it takes for the icon's background. In the
       opaque icon the yellow K runs off every edge, so iOS darkens the K and the icon turns
       black. In dark mode, give iOS the same logo with transparent dark areas instead: iOS
       fills them with its dark background and keeps the K. iOS reads this link when the app
       is added to the Home Screen. -->
  <script>
    (() => {
      const icon = document.querySelector('link[rel="apple-touch-icon"]');
      const dark = matchMedia('(prefers-color-scheme: dark)');
      const update = () => {
        icon.href = dark.matches ? '/apple-touch-icon-dark.png' : '/apple-touch-icon.png';
      };
      update();
      dark.addEventListener('change', update);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>kaihuman</title>
  <meta name="description" content="kaihuman — a life OS in plain files: todos, habits, notes and dashboards, stored in your own GitHub repo." />
  <!-- What a shared app.kaihuman.com link (the /demo link above all) shows in chat apps. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="kaihuman" />
  <meta property="og:title" content="kaihuman" />
  <meta property="og:description" content="A life OS in plain files — todos, habits, notes and dashboards, stored in your own GitHub repo. Try the demo, no sign-in needed." />
  <meta property="og:image" content="https://app.kaihuman.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Cascade layer order guard. Cascivo's component CSS (e.g. the editor's
       padding/active-line layout) lives in @layer cascivo.component; Tailwind's
       Preflight reset (`* { padding: 0 }`) lives in @layer base. Layer priority
       is set by FIRST appearance, so this declaration must precede every other
       @layer rule the browser sees. The bundler hoists Cascivo's component CSS
       (pulled in as a component dependency) above the same declaration in
       index.css, so declaring it here — inline in <head>, before the bundled
       stylesheet — is the only place guaranteed to win.
       cascivo.reset (box-sizing + body margin, shipped since @cascivo/tokens
       1.x) is named FIRST so it stays the floor Cascivo documents it to be;
       left unnamed it would be appended last and outrank Tailwind's
       utilities. -->
  <style>@layer cascivo.reset, theme, base, components, utilities, cascivo.tokens, cascivo.base, cascivo.theme, cascivo.component;</style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
