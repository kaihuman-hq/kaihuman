<!doctype html><html lang="en"><head><meta charset="utf-8"><title>iOS widgets</title><link rel="stylesheet" href="kit.css"><script src="kit.js"></script></head><body><main id="root"></main><script>
const W=(cls,inner)=>`<div class="w ${cls}">${inner}</div>`;
const today=s=>`<div class="whd"><span>TODAY</span><span class="cnt">3/5</span></div><ul class="wl">${[['prog','Ship widget redesign'],['','Call the dentist'],['','Renew passport','Mon']].slice(0,s?3:3).map(([c,t,d])=>`<li><span class="wcb ${c}"></span><span class="t">${t}</span>${d&&!s?`<span class="wdue">${d}</span>`:''}</li>`).join('')}</ul>`;
const habRow=(n,s,st)=>`<div class="hrow"><span class="hn">${n}</span><span class="hd">${[...s].map((c,i)=>`<i class="${c==='1'?'on':''}${i===6?' td':''}"></i>`).join('')}</span><span class="hs">${st}</span></div>`;
const widgets=t=>`<div class="hs-bg"><div class="wgrid">
${W('s',`<div class="whd"><span>TODAY</span><span class="cnt">3 left</span></div><ul class="wl">${['Ship widget redesign','Call the dentist','Renew passport'].map((x,i)=>`<li><span class="wcb ${i?'':'prog'}"></span><span class="t">${x}</span></li>`).join('')}</ul><div class="wft"><span class="pb"><b style="width:40%"></b></span>2/5 done</div>`)}
${W('s',`<div class="whd"><span>MEDITATE</span><span class="wbtn">${I('check',3)}</span></div><div class="wbig">12</div><div class="wsub">day streak</div><div class="hd one" style="margin-top:auto">${[...'1101111'].map((c,i)=>`<i class="${c==='1'?'on':''}${i===6?' td':''}"></i>`).join('')}</div>`)}
${W('m',`<div style="display:flex;gap:14px;height:100%"><div style="width:96px;display:flex;flex-direction:column;border-right:.5px solid var(--sep);padding-right:12px"><div class="whd"><span>TODAY</span></div><div class="wbig" style="margin-top:10px">3</div><div class="wsub">left of 5</div><div class="wsub" style="color:var(--warn);margin-top:auto">1 overdue</div></div><ul class="wl" style="flex:1;margin-top:0">${[['prog','Ship widget redesign','#mobile'],['','Call the dentist','10:00'],['','Renew passport','Mon'],['','Water plants','']].map(([c,t,d])=>`<li><span class="wcb ${c}"></span><span class="t">${t}</span><span class="wdue">${d}</span></li>`).join('')}</ul></div>`)}
${W('m',`<div class="whd"><span>HABITS</span><span class="cnt">2/3 today</span></div><div style="display:flex;flex-direction:column;gap:0;justify-content:space-around;flex:1;margin-top:6px">${habRow('Meditate','1101111','12')}${habRow('Run','1010110','3')}${habRow('Read','1111110','6')}</div>`)}
${W('s',`<div class="whd"><span>TIMER</span><span class="wbtn ghost">${I('stop',3)}</span></div><div class="wsub" style="margin-top:12px;color:var(--label);font-weight:600"><span class="live"></span>Deep work</div><div class="wbig" style="font-size:30px">1:24</div><div class="wsub">today 3h 52m</div>`)}
${W('s wcap',`<div class="g2">${[['check','Todo'],['note','Note'],['pen','Log'],['bulb','Idea']].map(([i,l],k)=>`<div class="cbtn ${k?'':'pri'}">${I(i,2.2).replace('<svg','<svg width="20" height="20"')}${l}</div>`).join('')}</div>`)}
</div></div>`;
root.innerHTML=`<style>
.hs-bg{width:436px;padding:28px 24px;border-radius:44px}.light .hs-bg{background:linear-gradient(160deg,#dfe6c3,#b9c7d9)}.dark .hs-bg{background:linear-gradient(160deg,#20261a,#141a26)}
.light{--wbg:#fff;--warn:#B25000}.dark{--wbg:#1B1C19;--warn:#FFD60A}
.wgrid{display:grid;grid-template-columns:170px 170px;gap:24px}
.w{border-radius:22px;padding:15px;background:var(--wbg);color:var(--label);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.w.s{width:170px;height:170px}.w.m{width:364px;height:170px;grid-column:span 2}
.whd{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--accent);height:22px}
.cnt{font-family:var(--mono);color:var(--sec);letter-spacing:0;font-weight:600}
.wl{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:9px}.wl li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;min-width:0}
.wl .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wdue{font-size:11px;color:var(--sec);font-weight:600}
.wcb{flex:none;width:17px;height:17px;border-radius:9px;border:1.6px solid var(--sec);position:relative}.wcb.prog{border-color:var(--info)}.wcb.prog::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--info)}
.wft{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--sec);font-weight:600}.pb{width:60px;height:5px;border-radius:3px;background:var(--track);overflow:hidden}.pb b{display:block;height:100%;background:var(--hi)}
.wbig{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.05em;line-height:1;margin-top:8px}.wsub{font-size:12px;color:var(--sec);font-weight:500;margin-top:3px}
.wbtn{width:28px;height:28px;border-radius:14px;background:var(--afill);color:var(--onafill);display:flex;align-items:center;justify-content:center}.wbtn svg{width:14px;height:14px}.wbtn.ghost{background:var(--fill);color:var(--label)}
.hd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1}.hd i{height:16px;border-radius:5px;background:var(--track)}.hd i.on{background:var(--hi)}.hd i.td{box-shadow:inset 0 0 0 2px var(--label)}.hd.one{flex:none}.hd.one i{height:20px}
.hrow{display:flex;align-items:center;gap:10px}.hn{width:72px;font-size:13px;font-weight:600}.hs{width:22px;text-align:right;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--sec)}
.g2{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.cbtn{border-radius:16px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600}.cbtn.pri{background:var(--afill);color:var(--onafill)}.w.wcap{padding:10px}
</style><h1>iOS home-screen widgets</h1><p class="lede">Today-only task list (due today + overdue + in progress), one-row habit activity, live timer, capture grid. Small = 170², medium = 364×170. Volt on Ink, matches the app.</p><div class="stage">${['light','dark'].map(t=>`<div class="${t}"><div class="cap">${t}</div>${widgets(t)}</div>`).join('')}${notes([['Widgets',['<b>Today (S/M)</b>: only today’s tasks. Small = 3 rows + progress; medium adds count column and due/tag. Tap ○ = toggle in-widget.','<b>Habit (S)</b>: one habit (configurable), streak + 7-day row, ✓ logs today in-widget.','<b>Habits (M)</b>: up to 3 habits, one row each, streak right.','<b>Timer (S)</b>: Text(timerInterval:) ticks without reloads; ■ stops.','<b>Capture (S)</b>: 4 deep links.','Snapshot adds: <b>todayItems</b>, <b>habits[].days[7]</b>, <b>timer</b>.']],['Animation',['<span class="anim">toggle</span>WidgetKit .contentTransition(.numericText) on counts; row fades out.','<span class="anim">habit ✓</span>today cell fills via .transition(.scale).','<span class="anim">timer</span>system-driven, no reloads.']]])}</div>`;
</script></body></html>
