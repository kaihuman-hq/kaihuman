<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Todos tile and detail</title><link rel="stylesheet" href="kit.css"><script src="kit.js"></script></head><body><main id="root"></main><script>
const detail=t=>`<div class="nav"><span class="b">${I('back',2.4).replace('<svg','<svg width="22" height="22"')}Today</span><span style="display:flex;gap:18px">${I('search',2.2).replace('<svg','<svg width="22" height="22"')}${I('plus',2.4).replace('<svg','<svg width="24" height="24"')}</span></div><div class="lt">Todos</div><div class="segc"><span class="on">Today<em>4</em></span><span>Doing<em>2</em></span><span>Open<em>7</em></span><span>Done</span></div>
<div class="gh">Overdue</div><div class="grp"><div class="li"><span class="cb"></span><span class="txt">Renew passport</span><span class="chip due">Mon</span></div></div>
<div class="gh">Today</div><div class="grp"><div class="li"><span class="cb prog"></span><span class="txt">Ship widget redesign</span><span class="chip">#mobile</span></div><div class="li"><span class="cb"></span><span class="txt">Call the dentist</span><span class="meta">${I('repeat',2).replace('<svg','<svg width="14" height="14"')}</span></div><div class="swipe" style="position:relative"><div class="li"><span class="cb"></span><span class="txt">Water plants</span></div><div class="del">Delete</div></div><div class="li"><span class="cb done"></span><span class="txt done-t">Review PR #412</span></div></div>
<div class="gh">In progress</div><div class="grp"><div class="li"><span class="cb prog"></span><span class="txt">Budget import from bank CSV</span></div></div>`+(t==='light'?ann(1,'tap ○ → ✓ draws, row slides to Done',60,612)+ann(2,'swipe ← delete, row collapses',60,650)+ann(3,'segment = filter, crossfade',160,112):'');
const add=t=>`<div class="nav"><span>Cancel</span><span style="color:var(--label);font-weight:600">New todo</span><span style="font-weight:600">Add</span></div><div style="height:16px"></div><div class="field">Buy train tickets to Brno<span class="caret"></span></div><div class="opts"><span class="opt on">${I('cal',2)}Today</span><span class="opt">${I('cal',2)}Tomorrow</span><span class="opt">${I('flag',2)}Priority</span><span class="opt">${I('repeat',2)}Repeat</span><span class="opt">#travel</span></div><div style="font-size:12px;color:var(--sec);margin:4px 20px">Saved to inbox.todos.md · return adds and keeps the sheet open</div><div class="kbd"><div class="kr">${'<i></i>'.repeat(10)}</div><div class="kr">${'<i></i>'.repeat(9)}</div><div class="kr"><i class="m"></i>${'<i></i>'.repeat(7)}<i class="m"></i></div><div class="kr"><i class="m"></i><i class="w"></i><i class="m" style="width:88px;background:var(--afill)"></i></div></div>`;
const tile=t=>`<div class="${t}" style="background:var(--bg);padding:28px;border-radius:28px;display:flex;flex-direction:column;gap:18px;align-items:center"><div style="transform:scale(1.4);transform-origin:top center;margin-bottom:72px">${T.todos()}</div><div style="font-size:12px;color:var(--sec);max-width:240px;text-align:center;line-height:1.45">open · in progress · overdue counts. Bar = share per status. <b style="color:var(--label)">+</b> opens New todo. Tap tile opens the list on <b style="color:var(--label)">Today</b>.</div></div>`;
root.innerHTML=`<h1>Todos: tile, detail, add</h1><p class="lede">Tile is counts only. Detail = native list with segmented filter (Today · Doing · Open · Done), grouped by Overdue/Today/In progress. Add is its own sheet with quick chips; the dashboard never shows a text field.</p><div class="stage" style="flex-direction:column;gap:40px">${['light','dark'].map(t=>`<div class="stage"><div><div class="cap">Tile · ${t}</div>${tile(t)}</div><div><div class="cap">Detail · ${t}</div>${phone(t,detail(t))}</div><div><div class="cap">Add sheet · ${t}</div>${phone(t,add(t))}</div>${t==='light'?notes([['Decisions',['Tile replaces the full inline todo list (was the only “full” tile).','<b>Today</b> = due today + overdue + in progress.','Status cycle on tap: open → done. Long-press: start (→ in progress), move, edit.','Add sheet: return = add + keep open for bursts.']],['Animation',['<span class="anim">check</span>ring fills, check stroke draws 200 ms, text strikes, row slides out after 600 ms (undo window).','<span class="anim">delete</span>swipe reveals red, release: height collapses 220 ms, rows below spring up.','<span class="anim">add</span>new row drops in at top with highlight flash; tile count rolls.']]]):''}</div>`).join('')}</div>`;
</script></body></html>
