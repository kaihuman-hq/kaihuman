<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Quick menu</title><link rel="stylesheet" href="kit.css"><script src="kit.js"></script></head><body><main id="root"></main><script>
const q=[['check','lime','Todo'],['note','blue','Note'],['pen','violet','Log'],['bulb','orange','Idea'],['brain','blue','Knowledge'],['flame','orange','Habit ✓'],['cup','orange','Coffee +1'],['clock','green','Start timer'],['wallet','green','Expense'],['db','lime','Weight'],['cal','red','Event'],['book','violet','Save link']];
const body=t=>dhead('Today',0)+`<div class="grid">${T.todos()}${T.habit()}${T.time()}${T.consumption()}${T.events()}${T.budget()}</div><div class="scrim"></div><div class="sheet"><div class="grab"></div><h4>Capture</h4><div class="qgrid">${q.slice(0,5).concat([]).slice(0,4).map(([i,c,l])=>`<div class="qi"><span class="ic c-${c}">${I(i,2)}</span>${l}</div>`).join('')}</div><h4 style="margin-top:16px">Track</h4><div class="qgrid">${q.slice(5,13).filter((_,i)=>i!==99).slice(0,8).map(([i,c,l])=>`<div class="qi"><span class="ic c-${c}">${I(i,2)}</span>${l}</div>`).join('')}</div><div class="recent"><div class="rrow"><span class="ic c-orange">${I('cup',2)}</span>Coffee +1<span class="m">used 4× today</span></div></div></div>`+tabs(true)+(t==='light'?ann(1,'+ rotates 45° → ×',220,772)+ann(2,'sheet springs up',20,330)+ann(3,'icons stagger 20 ms',230,330):'');
root.innerHTML=`<h1>Center “+” tab → quick menu</h1><p class="lede">Tab bar: Today · Board · ＋ · Ideas · More. The old Capture tab and the page-1 shortcut row merge into one raised center button. Tap opens a bottom sheet with two groups. Long-press ＋ = last used action directly.</p><div class="stage">${pair(body)}${notes([['Decisions',['<b>Capture</b> (open a quick-* sheet): Todo, Note, Log, Idea, Knowledge.','<b>Track</b> (one tap, no screen, toast with Undo): Habit ✓, Coffee +1, Start timer. Expense/Weight/Event open a one-field sheet.','Track items come from tiles on the dashboards, so the menu fits the user.','Bottom row = most used action today (shortcut to repeat).','Knowledge stays in the full launcher (5th Capture item scrolls).','Deep links unchanged: kaihuman://quick-todo etc.']],['Animation',['<span class="anim">open</span>scrim fades 0→42% 180 ms; sheet spring (damping 18); ＋ rotates 45° to ×.','<span class="anim">items</span>scale .8→1 + fade, stagger 20 ms.','<span class="anim">track tap</span>icon fills, check-mark draws, sheet closes, matching tile hero rolls +1.','<span class="anim">close</span>drag down or tap scrim; velocity-based dismiss.']]])}</div>`;
</script></body></html>
