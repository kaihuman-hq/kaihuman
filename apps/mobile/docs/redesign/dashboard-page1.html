<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dashboard page 1</title><link rel="stylesheet" href="kit.css"><script src="kit.js"></script></head><body><main id="root"></main><script>
const body=t=>dhead('Today',0)+`<div class="grid">${T.todos().replace('class="tile"','class="tile press"')}${T.habit()}${T.time()}${T.consumption()}${T.events()}${T.budget()}${T.board()}${T.actionlog()}</div>`+tabs()+(t==='light'?ann(1,'press → scale .96',20,180)+ann(2,'“+” = quick add',250,168)+ann(3,'swipe ← page 2',230,104)+ann(4,'center + = quick menu',140,742):'');
root.innerHTML=`<h1>Dashboard · page 1 “Today”</h1><p class="lede">2 columns, every tile 174×174 square, 13 pt gutters. Each tile = icon + name, one hero number, one tiny visual. Tap anywhere = deep-dive view. Round “+” / ✓ / ■ top-right = one-tap quick action. Quick-capture row removed; it lives in the center tab.</p><div class="stage">${pair(body)}${notes([['Decisions',['<b>Square only.</b> No compact/medium/full classes. Long content goes to the detail view.','<b>Anatomy:</b> header 24 pt · flexible space · hero (mono 34) · label · viz ≤ 40 pt. Same baseline in every tile, so the grid reads as rows.','<b>Quick action</b> only where an entry is one tap or one field: todos, habit check, timer start/stop, consumption, budget, log, events.','<b>Todos tile</b> shows counts, not rows.','Shortcuts row gone from page 1.']],['Animation',['<span class="anim">press</span>spring scale 1→.96, 120 ms, light haptic; release overshoots 1.01.','<span class="anim">open</span>shared-element zoom: tile grows into the detail screen (iOS zoom transition).','<span class="anim">quick +</span>button pops 1→1.15→1, hero number rolls (odometer) to the new value, success haptic.','<span class="anim">page</span>paged swipe, dots stretch 7→18 pt, tiles stagger in 30 ms each.']]])}</div>`;
</script></body></html>
