[package]
name = "desktop-palette-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway phase-0 spike: can a Tauri window be a centered, focused palette on Hyprland?"

[[bin]]
name = "lifosy-palette-spike"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri's Linux windows are GTK3 windows; gtk-layer-shell 0.8 builds on the same gtk 0.18.
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# Resolves gtk_layer_try_force_commit at runtime: newer C library than the Rust bindings expose.
libloading = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
