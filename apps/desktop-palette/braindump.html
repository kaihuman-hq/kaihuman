<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>lifosy-braindump</title>
    <style>
      /* The palette's colours, as a plain window: text first, a status line below. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0d0d;
        color: #e6e6e6;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 14px;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .braindump-text,
      .braindump-list {
        flex: 1;
        min-height: 0;
      }
      .braindump-text {
        box-sizing: border-box;
        width: 100%;
        padding: 16px 18px;
        border: 0;
        outline: 0;
        resize: none;
        background: transparent;
        color: #f5f5f5;
        font: inherit;
        line-height: 1.5;
      }
      .braindump-text::placeholder,
      .braindump-filter::placeholder {
        color: #6b6b6b;
      }
      .braindump-list {
        display: flex;
        flex-direction: column;
      }
      .braindump-list[hidden],
      .braindump-text[hidden] {
        display: none;
      }
      .braindump-filter {
        padding: 14px 18px;
        border: 0;
        border-bottom: 1px solid #262626;
        outline: 0;
        background: transparent;
        color: #f5f5f5;
        font: inherit;
      }
      .braindump-rows {
        flex: 1;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        list-style: none;
      }
      .braindump-row {
        padding: 8px 18px;
        border-left: 2px solid transparent;
        cursor: pointer;
      }
      .braindump-row[aria-selected='true'] {
        background: #171717;
        border-left-color: #7dd3a7;
      }
      .braindump-row .title {
        color: #f5f5f5;
      }
      .braindump-row .subtitle,
      .braindump-empty {
        color: #8a8a8a;
        font-size: 12px;
      }
      .braindump-empty {
        padding: 16px 18px;
      }
      .braindump-status {
        display: flex;
        gap: 12px;
        padding: 6px 18px;
        border-top: 1px solid #262626;
        color: #8a8a8a;
        font-size: 12px;
        white-space: nowrap;
      }
      .braindump-title {
        color: #7dd3a7;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .braindump-state {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .braindump-hints {
        margin-left: auto;
        color: #6b6b6b;
      }
    </style>
    <script type="module" src="/src/braindump.ts"></script>
  </head>
  <body></body>
</html>
