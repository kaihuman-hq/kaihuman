<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>kaihuman-braindump</title>
    <style>
      /* The palette's colours, as a plain window: text first, a status line below. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0d0d;
        color: #e6e6e6;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 14px;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .braindump-editor,
      .braindump-list {
        flex: 1;
        min-height: 0;
      }
      .braindump-editor {
        position: relative;
      }
      /* The textarea and the copy of its text behind it (the find matches) wrap the same way. */
      .braindump-text,
      .braindump-marks {
        box-sizing: border-box;
        margin: 0;
        padding: 16px 18px;
        border: 0;
        font: inherit;
        line-height: 1.5;
        letter-spacing: normal;
        tab-size: 8;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
      .braindump-text {
        position: relative;
        width: 100%;
        height: 100%;
        outline: 0;
        resize: none;
        background: transparent;
        color: #f5f5f5;
      }
      .braindump-marks {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        overflow: hidden;
        color: transparent;
        pointer-events: none;
      }
      .braindump-marks mark {
        border-radius: 2px;
        background: rgba(250, 204, 21, 0.3);
        color: transparent;
      }
      .braindump-marks mark.current {
        background: rgba(249, 115, 22, 0.75);
      }
      .braindump-text::placeholder,
      .braindump-filter::placeholder {
        color: #6b6b6b;
      }
      .braindump-list {
        display: flex;
        flex-direction: column;
      }
      .braindump-list[hidden],
      .braindump-editor[hidden],
      .braindump-find[hidden] {
        display: none;
      }
      .braindump-find {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 18px;
        border-top: 1px solid #262626;
        font-size: 12px;
        white-space: nowrap;
      }
      .braindump-find-input {
        flex: 1;
        min-width: 0;
        padding: 4px 8px;
        border: 1px solid #333;
        border-radius: 4px;
        outline: 0;
        background: #171717;
        color: #f5f5f5;
        font: inherit;
      }
      .braindump-find-input:focus {
        border-color: #7dd3a7;
      }
      .braindump-find-input::placeholder {
        color: #6b6b6b;
      }
      .braindump-find-count {
        color: #8a8a8a;
      }
      .braindump-find-hints {
        color: #6b6b6b;
      }
      .braindump-filter {
        padding: 14px 18px;
        border: 0;
        border-bottom: 1px solid #262626;
        outline: 0;
        background: transparent;
        color: #f5f5f5;
        font: inherit;
      }
      .braindump-rows {
        flex: 1;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        list-style: none;
      }
      .braindump-row {
        padding: 8px 18px;
        border-left: 2px solid transparent;
        cursor: pointer;
      }
      .braindump-row[aria-selected='true'] {
        background: #171717;
        border-left-color: #7dd3a7;
      }
      .braindump-row .title {
        color: #f5f5f5;
      }
      .braindump-row .subtitle,
      .braindump-empty {
        color: #8a8a8a;
        font-size: 12px;
      }
      .braindump-empty {
        padding: 16px 18px;
      }
      .braindump-status {
        display: flex;
        gap: 12px;
        padding: 6px 18px;
        border-top: 1px solid #262626;
        color: #8a8a8a;
        font-size: 12px;
        white-space: nowrap;
      }
      .braindump-title {
        color: #7dd3a7;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .braindump-state {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .braindump-hints {
        margin-left: auto;
        color: #6b6b6b;
      }
    </style>
    <script type="module" src="/src/braindump.ts"></script>
  </head>
  <body></body>
</html>
