# Knowledge quick-capture for Hyprland.
# Append to ~/.config/hypr/hyprland.conf (or `source` this file from it).

# ── Single-line overlay (wofi/fuzzel/zenity) ──────────────────────────────────
# Fast capture. Uses ~/.local/bin/kh-capture (see scripts/README.md).
bind = SUPER, K, exec, ~/.local/bin/kh-capture

# ── Multi-line overlay (floating terminal + $EDITOR) ──────────────────────────
# `cli capture` with no input opens $EDITOR when run in a terminal, giving real
# multi-line editing. The window rules float + center it like an overlay.
# Replace `kitty` with your terminal; keep the --class so the rules match.
#
# bind = SUPER SHIFT, K, exec, kitty --class kh-capture -e cli capture
# windowrulev2 = float,  class:^(kh-capture)$
# windowrulev2 = center, class:^(kh-capture)$
# windowrulev2 = size 720 320, class:^(kh-capture)$
