name: "[PROD] Deploy auth worker"

# Deploys apps/auth-worker (auth.kaihuman.com) to Cloudflare Workers.
# GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET live on the worker as secrets; `wrangler deploy` keeps them.
on:
  push:
    branches:
      - main
    paths:
      - "apps/auth-worker/**"
      - ".github/workflows/deploy-auth-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-auth-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and test
        working-directory: apps/auth-worker
        run: |
          pnpm run lint
          pnpm run check-types
          pnpm run test

      - name: Deploy
        working-directory: apps/auth-worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
