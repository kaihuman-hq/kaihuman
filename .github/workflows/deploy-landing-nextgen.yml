name: "[PROD] Deploy Landing Page Nextgen"

on:
  push:
    branches:
      - main
    paths:
      - "apps/landing-page-nextgen/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-landing-nextgen:
    uses: ./.github/workflows/template-deploy-to-cloudflare.yaml
    with:
      buildTarget: landing-nextgen:build
      rootDir: ./apps/landing-page-nextgen
      distDir: ./dist
      cfPagesName: kh-landingpage-nextgen
      branchName: main
      commitGeneratedFile: false
    secrets:
      cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
      cf_api_token: ${{ secrets.CF_API_TOKEN }}
