name: "[PROD] Deploy Life OS"

# on:
#   push:
#     branches:
#       - main

on:
  push:
    branches:
      - main
    # The console bundles these workspace packages, so a change to any of them changes the site.
    paths:
      - "apps/console/**"
      - "packages/config/**"
      - "packages/core/**"
      - "packages/formats/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-magic-life-os.yaml"
      - ".github/workflows/template-deploy-to-cloudflare.yaml"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  publish-kaihuman:
    uses: ./.github/workflows/template-deploy-to-cloudflare.yaml
    with:
      buildTarget: console:build
      rootDir: ./apps/console
      distDir: ./dist
      cfPagesName: lifosy-console
      branchName: main
      commitGeneratedFile: true
      generatedFilePath: apps/console/src/version.ts apps/console/version.json
    secrets:
      cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
      cf_api_token: ${{ secrets.CF_API_TOKEN }}
