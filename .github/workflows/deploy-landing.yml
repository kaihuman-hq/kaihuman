name: "[PROD] Deploy Landing Page"

# The nextgen landing page is the default/production site, served by the
# `lifosy-landing` Cloudflare Pages project. It deploys on changes to either
# the nextgen app or its source assets (e.g. the auto-generated screencast),
# and on changes to the docspack Markdown, which the site renders at /docs/.

on:
  push:
    branches:
      - main
    paths:
      - "apps/landing-page-nextgen/**"
      - "packages/docspack/docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-landing:
    uses: ./.github/workflows/template-deploy-to-cloudflare.yaml
    with:
      buildTarget: landing-nextgen:build
      rootDir: ./apps/landing-page-nextgen
      distDir: ./dist
      cfPagesName: lifosy-landing
      branchName: main
      commitGeneratedFile: false
    secrets:
      cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
      cf_api_token: ${{ secrets.CF_API_TOKEN }}
