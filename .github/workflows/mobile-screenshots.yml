name: "Mobile screenshots"

# Real native screenshots of apps/mobile (iOS Simulator + Android emulator), light and dark, so the
# native look can be judged without a Mac. Output: the `mobile-screenshots` artifact.
# Screens get data from `kaihuman://demo` (non-interactive "Try demo").

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only changes to the app itself: shared packages and tests do not change how screens look,
    # and a run takes a macOS runner for up to 90 minutes. Run it by hand to check anything else.
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/docs/**"
      - "!apps/mobile/**/*.test.ts"
      - "!apps/mobile/**/*.test.tsx"
      - "!apps/mobile/scripts/release*"
      - ".github/workflows/mobile-screenshots.yml"
      - ".github/scripts/mobile-screenshots-*.sh"

permissions:
  contents: read

concurrency:
  group: mobile-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    # The Release build takes ~27 min and each of the 20 screenshots ~1 min (Maestro starts per flow).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@kaihuman/mobile^...

      - name: Prebuild native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      # Release embeds the JS bundle, so the app runs without Metro.
      - name: Build Release app for the simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild build \
            -workspace kaihuman.xcworkspace \
            -scheme kaihuman \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 1.41.0
          # sha256 of the cli-1.41.0 maestro.zip release asset (no checksum file is published; computed from the download)
          MAESTRO_SHA256: 0b87a2eed8c1594fe572c5f29d6d64af389f4b7231ddde714179bbcb05f0fe0c
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          mkdir -p "$HOME/.maestro"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro"
          echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Take screenshots
        timeout-minutes: 55
        run: .github/scripts/mobile-screenshots-ios.sh apps/mobile/ios/build/Build/Products/Release-iphonesimulator/kaihuman.app screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-ios
          path: |
            screenshots/*.png
            screenshots/*.ips
          if-no-files-found: warn

  android:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift
          sudo docker image prune --all --force

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@kaihuman/mobile^...

      - name: Prebuild native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # services.gradle.org sometimes times out (504 or the wrapper's 10 s limit) before any code
      # compiles. Cache the distribution, give the wrapper 2 minutes, and retry the download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: gradle-

      - name: Download Gradle (with retries)
        working-directory: apps/mobile/android
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' "$props"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$props"
          else
            echo 'networkTimeout=120000' >> "$props"
          fi
          for attempt in 1 2 3 4 5; do
            ./gradlew --version --no-daemon && exit 0
            echo "Gradle download failed (attempt $attempt), retrying"
            sleep $((attempt * 20))
          done
          exit 1

      # x86_64 only: it is the emulator's ABI and skips three NDK builds. Release is signed with the
      # debug key by the Expo template and embeds the JS bundle.
      - name: Assemble release APK
        working-directory: apps/mobile/android
        # Maven/GitHub release downloads (e.g. kotlin-compiler-embeddable) sometimes 504; Gradle
        # keeps finished tasks, so a retry only refetches what failed.
        run: |
          for attempt in 1 2 3; do
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64 && exit 0
            echo "Gradle build failed (attempt $attempt), retrying"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: .github/scripts/mobile-screenshots-android.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-android
          path: |
            screenshots/*.png
            screenshots/*.txt
          if-no-files-found: warn

  collect:
    needs: [ios, android]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: all
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: all/*
