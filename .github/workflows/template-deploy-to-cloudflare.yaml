name: "Deploy To CloudFlare"

on:
  workflow_call:
    inputs:
      rootDir:
        required: true
        type: string
      distDir:
        required: true
        type: string
      branchName:
        required: true
        type: string
      cfPagesName:
        required: true
        type: string
      buildTarget:
        required: true
        type: string
      commitGeneratedFile:
        required: false
        type: boolean
        default: false
      generatedFilePath:
        required: false
        type: string
    secrets:
      cf_account_id:
        required: true
      cf_api_token:
        required: true

jobs:
  deploy-to-cloudflare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract branch name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: extract_branch

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build monorepo
        run: pnpm run build

      - name: Build Target
        run: pnpm run ${{ inputs.buildTarget }}

      - name: Commit Generated File
        if: ${{ inputs.commitGeneratedFile }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ${{ inputs.generatedFilePath }}
          git commit -m "chore: update generated version [skip ci]" || echo "No changes to commit"
          git push


      - name: Publish
        id: publish
        run: |
          npm i -g wrangler
          cd ${{ env.ROOT_DIRECTORY }}
          wrangler pages deploy ${{ env.DIST_DIRECTORY }} --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch="${{ env.BRANCH_NAME }}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cf_api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cf_account_id }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ inputs.cfPagesName }}
          DIST_DIRECTORY: ${{ inputs.distDir }}
          ROOT_DIRECTORY: ${{ inputs.rootDir }}
          BRANCH_NAME: ${{ inputs.branchName }}
