name: "Deploy To CloudFlare"

on:
  workflow_call:
    inputs:
      rootDir:
        required: true
        type: string
      distDir:
        required: true
        type: string
      branchName:
        required: true
        type: string
      cfPagesName:
        required: true
        type: string
      buildTarget:
        required: true
        type: string
    secrets:
      cf_account_id:
        required: true
      cf_api_token:
        required: true

jobs:
  deploy-to-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm run build

      - name: Build Target
        run: pnpm run "$BUILD_TARGET"
        env:
          BUILD_TARGET: ${{ inputs.buildTarget }}

      - name: Publish
        id: publish
        run: |
          npm i -g wrangler@4.148.0
          cd "$ROOT_DIRECTORY"
          wrangler pages deploy "$DIST_DIRECTORY" --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch="$BRANCH_NAME" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cf_api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cf_account_id }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ inputs.cfPagesName }}
          DIST_DIRECTORY: ${{ inputs.distDir }}
          ROOT_DIRECTORY: ${{ inputs.rootDir }}
          BRANCH_NAME: ${{ inputs.branchName }}
