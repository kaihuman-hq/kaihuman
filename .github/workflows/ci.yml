name: "CI"

# Builds, lints, type-checks and tests every pull request that is not a draft, so a broken
# lockfile, build or test shows up before the deploy workflows run on main. Main itself is
# skipped: the deploy workflows build it.
#
# Only the packages a pull request touches, and the packages that depend on them, are checked
# (`turbo --affected`). Changes to shared root config run everything, because turbo cannot see
# that dependency (`changes` below lists those files). Jobs that only some packages need are skipped
# as a whole, which still counts as a pass for required checks.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Draft PRs don't run CI; marking the PR ready for review triggers it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.diff.outputs.full }}
      cli: ${{ steps.diff.outputs.cli }}
      einvoice: ${{ steps.diff.outputs.einvoice }}
      console: ${{ steps.diff.outputs.console }}
    steps:
      # The pull_request checkout is a merge commit; its first parent is the base branch tip, so
      # two commits of history are enough to diff the whole pull request.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: diff
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          has() { grep -Eq "$1" <<<"$files" && echo true || echo false; }
          # Root files every package reads (devDependencies, Biome, turbo, workspace) and the shared
          # config that apps extend by relative path.
          full=$(has '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|biome\.json|packages/config/|\.github/workflows/ci\.yml$)')
          {
            echo "full=$full"
            echo "cli=$([ "$full" = true ] && echo true || has '^apps/cli/')"
            echo "einvoice=$([ "$full" = true ] && echo true || has '^packages/formats/')"
            # What the console deploy bundles (deploy-magic-life-os.yaml), without the lockfile.
            echo "console=$(has '^(apps/console/|packages/(config|core|formats|ui)/)')"
          } >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    runs-on: ubuntu-latest
    env:
      # Empty on a full run; otherwise only affected packages, compared with the base branch tip.
      AFFECTED: ${{ needs.changes.outputs.full != 'true' && '--affected' || '' }}
      TURBO_SCM_BASE: HEAD^1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The CLI (apps/cli) builds with cargo; these are the libraries its clipboard and TLS crates
      # link against.
      - name: Install system libraries
        if: needs.changes.outputs.cli == 'true'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.changes.outputs.cli == 'true'
        with:
          workspaces: apps/cli

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build $AFFECTED

      - name: Lint and type-check
        run: pnpm turbo run lint check-types $AFFECTED

      - name: Test
        run: pnpm turbo run test $AFFECTED

  # The console deploy cannot push to main, so a pull request that changes the console bumps its
  # version itself (`pnpm --filter @kaihuman/app-console version:bump`).
  console-version:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version bump
        run: node apps/console/scripts/check-version-bump.js HEAD^1

  # Phase 6: every golden e-invoice must pass the KoSIT validator with the XRechnung configuration.
  # The goldens are what the serialisers produce (a Vitest test keeps them in sync), so this checks
  # the serialisers against the official Schematron and schemas.
  einvoice:
    needs: changes
    if: needs.changes.outputs.einvoice == 'true'
    runs-on: ubuntu-latest
    env:
      KOSIT_VALIDATOR: 1.6.3
      KOSIT_VALIDATOR_SHA256: 799e64befca97d4080e03608c80b85dd5a5ecc5f4ae4f35d1116ec2855b9a7c9
      XRECHNUNG_CONFIG: xrechnung-3.0.2-validator-configuration-2026-08-31
      XRECHNUNG_CONFIG_TAG: v2026-08-31
      XRECHNUNG_CONFIG_SHA256: 2530cd107c414511c5d0462ec10f886910395abfca820db82e83d70bf01221a8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache KoSIT downloads
        uses: actions/cache@v4
        with:
          path: ~/kosit
          key: kosit-${{ env.KOSIT_VALIDATOR_SHA256 }}-${{ env.XRECHNUNG_CONFIG_SHA256 }}

      - name: Download validator and configuration
        run: |
          mkdir -p ~/kosit && cd ~/kosit
          [ -f validator.jar ] || curl -fsSL -o validator.jar \
            "https://repo1.maven.org/maven2/org/kosit/validator/${KOSIT_VALIDATOR}/validator-${KOSIT_VALIDATOR}-standalone.jar"
          [ -f config.zip ] || curl -fsSL -o config.zip \
            "https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/${XRECHNUNG_CONFIG_TAG}/${XRECHNUNG_CONFIG}.zip"
          echo "${KOSIT_VALIDATOR_SHA256}  validator.jar" | sha256sum -c -
          echo "${XRECHNUNG_CONFIG_SHA256}  config.zip" | sha256sum -c -
          rm -rf config && unzip -q config.zip -d config

      - name: Validate golden e-invoices
        run: |
          mkdir -p reports
          java -jar ~/kosit/validator.jar -s ~/kosit/config/scenarios.xml -r ~/kosit/config \
            -o reports -h packages/formats/fixtures/business/einvoice/*.xml || true
          failed=0
          for f in packages/formats/fixtures/business/einvoice/*.xml; do
            report="reports/$(basename "${f%.xml}")-report.xml"
            if [ -f "$report" ] && grep -Eq '<([A-Za-z]+:)?accept[ />]' "$report"; then
              echo "accepted: $f"
            else
              echo "::error file=$f::KoSIT did not accept $f (see the kosit-reports artifact)"
              failed=1
            fi
          done
          exit $failed

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosit-reports
          path: reports/
