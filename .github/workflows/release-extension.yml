name: "Release Browser Extension"

# Builds the Chrome Web Store zip. Pushing a tag `extension-v<version>` (the version in
# apps/browser-extension/package.json) also attaches the zip to a GitHub release; running it by
# hand only keeps the zip as a workflow artifact. Uploading to the store stays a manual step.

on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/browser-extension
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag names that version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "extension-v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION (expected extension-v$VERSION)"
            exit 1
          fi

      - name: Test
        run: pnpm run test

      - name: Build and package
        run: pnpm run package

      - uses: actions/upload-artifact@v4
        with:
          name: kaihuman-extension-${{ steps.version.outputs.version }}
          path: apps/browser-extension/release/kaihuman-extension-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Attach to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" "release/kaihuman-extension-$VERSION.zip" \
            --title "Browser extension $VERSION" \
            --notes "Chrome Web Store package for kaihuman $VERSION. Upload it in the developer dashboard."
