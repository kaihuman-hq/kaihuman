packages:
  - apps/*
  - packages/*

# pnpm 11 removed the `onlyBuiltDependencies` allowlist in favour of an explicit
# yes/no per dependency. Every package that was on the old allowlist is `true`;
# anything new that ships a build script has to be answered before it can run.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  sharp: true
  workerd: true

# @cascivo/* 1.3.0 (and the tokens 1.1.1 it pulls in) were published inside
# pnpm's 24h minimumReleaseAge window; these pins let the bump land now.
# Remove them once the versions have aged past the cutoff.
minimumReleaseAgeExclude:
  - '@cascivo/charts@1.3.0'
  - '@cascivo/core@1.3.0'
  - '@cascivo/editor@1.3.0'
  - '@cascivo/i18n@1.3.0'
  - '@cascivo/react@1.3.0'
  - '@cascivo/tokens@1.1.1'
